name: pumpwatch
description: PumpWatch - petrol and diesel prices in Ireland, reported by drivers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  cloud_firestore: any
  firebase_auth: any
  geolocator: any
  flutter_map: any
  latlong2: any
  image_picker: any
  google_mlkit_text_recognition: any
  shared_preferences: any
  url_launcher: any
  camera: any
  path_provider: any
  wakelock_plus: any
  floating: any

dev_dependencies:
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/stations.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F4F2EE"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24
