name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org app.viptech --project-name pumpwatch .
          rm -rf test
          python3 tool/patch_android.py

      - name: Get packages and icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.PW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PW_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release signing: upload key"
          else
            echo "No keystore secret: test build signed with a debug key (fine for testing, not for Google Play)"
          fi

      - name: Build APK and app bundle
        env:
          PW_KEYSTORE_PASSWORD: ${{ secrets.PW_KEYSTORE_PASSWORD }}
          PW_KEY_ALIAS: ${{ secrets.PW_KEY_ALIAS }}
          PW_KEY_PASSWORD: ${{ secrets.PW_KEY_PASSWORD }}
        run: |
          set -o pipefail
          report() {
            # Save the full log to the ci-logs branch so it can be read with git
            cp "$1" "$RUNNER_TEMP/build.log"
            git config user.name ci && git config user.email ci@users.noreply.github.com
            git checkout --orphan ci-logs >/dev/null 2>&1
            git rm -rfq . >/dev/null 2>&1 || true
            cp "$RUNNER_TEMP/build.log" build.log
            git add build.log && git commit -qm "build ${{ github.run_number }} log" && git push -qf origin ci-logs
          }
          flutter build apk --release --dart-define=PW_TEST=true --build-number=${{ github.run_number }} 2>&1 | tee apk.log || { report apk.log; exit 1; }
          flutter build appbundle --release --build-number=${{ github.run_number }} 2>&1 | tee aab.log || { report aab.log; exit 1; }
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/pumpwatch-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab out/pumpwatch-${{ github.run_number }}.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PumpWatch build ${{ github.run_number }}
          body: |
            Build ${{ github.run_number }} from ${{ github.sha }}.
            .apk = install on a phone to test. .aab = upload to Google Play Console.
          files: |
            out/pumpwatch-${{ github.run_number }}.apk
            out/pumpwatch-${{ github.run_number }}.aab
